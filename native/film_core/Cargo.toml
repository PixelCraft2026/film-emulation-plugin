[package]
name = "film_core"
version = "1.6.0"
edition = "2021"
license = "Proprietary"

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Builds the independent simd128 artifact.  Kernels retain the scalar
# numerics and exact seed/hash semantics; the capability bit is only exposed
# by this explicitly requested artifact and JS still performs a qualification
# probe before Auto selects it.
simd = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
